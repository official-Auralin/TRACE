name: Verify TRACE and deploy demo

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Formal, software, public artifact and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      build_id: ${{ steps.identity.outputs.build_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned Lean 4.24.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.24.0/lean-4.24.0-linux.tar.zst \
            --output "$RUNNER_TEMP/lean-4.24.0-linux.tar.zst"
          printf '%s  %s\n' b14f5e5159219dd1a1956c3b806813319f5e94ccd5bdfd56f54520609a5bb5ec \
            "$RUNNER_TEMP/lean-4.24.0-linux.tar.zst" | sha256sum --check --strict
          tar --zstd -xf "$RUNNER_TEMP/lean-4.24.0-linux.tar.zst" -C "$RUNNER_TEMP"
          echo "LEAN_BIN=$RUNNER_TEMP/lean-4.24.0-linux/bin" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/lean-4.24.0-linux/bin" >> "$GITHUB_PATH"
      - name: Verify mathematics, software, certificates and browser interpreter
        run: python3 -B -m benchmark.verify --output artifacts/ci/verification.json
      - name: Build only the approved public demo files and check repeatability
        run: |
          python3 -B -m benchmark.demo --output artifacts/pages-demo
          python3 -B -m benchmark.demo --output artifacts/pages-demo-repeat
          diff --recursive --brief artifacts/pages-demo artifacts/pages-demo-repeat
      - name: Record the expected deployed build
        id: identity
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          catalog = json.loads(Path('artifacts/pages-demo/catalog.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('build_id=' + catalog['build_id'] + '\n')
          PY
      - name: Install pinned browser test tooling outside the project
        run: |
          npm install --prefix "$RUNNER_TEMP/trace-browser" --no-audit --no-fund --save-exact playwright@1.64.1
          "$RUNNER_TEMP/trace-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise the game under a project subpath in Chromium
        env:
          TRACE_PLAYWRIGHT_MODULE: ${{ runner.temp }}/trace-browser/node_modules/playwright/index.mjs
        run: node tests/demo_browser.mjs artifacts/pages-demo
      - name: Retain compact verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.run_id }}
          path: |
            artifacts/ci/verification.json
            formal/proof_checks.json
            artifacts/demo-browser-checks/report.json
            artifacts/pages-demo/manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the curated Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: artifacts/pages-demo

  deploy:
    name: Deploy verified demo
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Check the deployed public catalog
        env:
          TRACE_DEMO_URL: ${{ steps.deployment.outputs.page_url }}
          TRACE_EXPECTED_BUILD: ${{ needs.verify.outputs.build_id }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          expected = os.environ['TRACE_EXPECTED_BUILD']
          url = os.environ['TRACE_DEMO_URL'].rstrip('/') + '/catalog.json?build=' + expected
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      catalog = json.load(response)
                  assert catalog['build_id'] == expected, 'Deployed catalog is from another build'
                  assert catalog['protocol_version'] == 'trace.demo.v1'
                  assert catalog['n_items'] == len(catalog['items']) > 0
                  print('Published demo:', catalog['build_id'], 'items:', catalog['n_items'])
                  break
              except Exception:
                  if attempt == 5:
                      raise
                  time.sleep(5)
          PY
