<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLOWBOX</title>
<style>
  :root{
    --bg:#16151a; --panel:#221f28; --cell:#2e2a36; --cell-edge:#454051;
    --ink:#efeae0; --dim:#8a8496; --gold:#f4c84a; --blue:#6aa8ff;
    --bad:#e0705f; --good:#7fd08a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Avenir Next",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
  h1{font-size:20px;letter-spacing:6px;margin:16px 0 10px;color:var(--gold)}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
  .tab{background:var(--panel);border:1px solid var(--cell-edge);color:var(--dim);
    border-radius:16px;padding:6px 14px;font-size:12px;cursor:pointer}
  .tab.active{color:var(--gold);border-color:var(--gold)}
  .tab.done::after{content:" ✔";color:var(--good)}
  #machine{background:var(--panel);border-radius:18px;padding:14px 16px 12px;box-shadow:0 8px 30px #0008;max-width:760px;width:min(96vw,760px)}
  .prompt{font-size:14.5px;margin:2px 0 8px;display:none;align-items:center;gap:8px}
  .prompt.show{display:flex}
  #svgwrap{overflow-x:auto}
  svg{display:block;margin:0 auto}
  /* tracks: every junction routes one of two ways — nothing is ever "off" */
  .trk{fill:none;stroke:#8d86a0;stroke-width:2.2;pointer-events:none}
  .trk.idle{stroke:#4a4556;opacity:.5}                 /* not aligned at its junction */
  .trk.live{stroke:var(--gold);stroke-width:3;stroke-dasharray:7 5;
            animation:flow 1s linear infinite;filter:drop-shadow(0 0 3px #f4c84a66)}
  @keyframes flow{to{stroke-dashoffset:-12}}
  .trkhit{fill:none;stroke:#fff;stroke-width:16;opacity:0;cursor:pointer}
  /* junctions: the lever IS the node */
  .jx{fill:var(--cell);stroke:#6a6378;stroke-width:1.8;cursor:pointer}
  .jx:hover{stroke:var(--ink)}
  .jxring{fill:none;stroke:var(--blue);stroke-width:1.6;opacity:.8}  /* thrown from recorded (experiment) */
  .jxhit{fill:#fff;opacity:0;cursor:pointer}
  .mg{fill:#6a6378}                                       /* merge point */
  /* the one bulb */
  .bulb{stroke-width:2}
  .bulb.lit{fill:#3a3220;stroke:var(--gold);filter:drop-shadow(0 0 10px var(--gold))}
  .bulb.dark{fill:#1c1a22;stroke:#4a4556}
  .bulbray{stroke:var(--gold);stroke-width:2;opacity:0}
  .bulbray.lit{opacity:1}
  .blab{font-size:14px;text-anchor:middle;pointer-events:none}
  .blab.lit{fill:var(--gold)} .blab.dark{fill:#4a4556}
  .gnd{stroke:#4a4556;stroke-width:1.6}
  .collab{fill:var(--dim);font-size:10px;text-anchor:middle}
  .collab.k{fill:var(--gold)}
  /* answer strip */
  .answer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:28px;
    margin:6px 2px;font-size:12px;color:var(--dim)}
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--cell);
    border:1px solid var(--blue);border-radius:12px;padding:3px 10px;font-size:12px;color:var(--ink)}
  .meters{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 8px;font-size:14px}
  .delta{font-size:11px;color:var(--dim)}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
  button{font-family:inherit;border:none;border-radius:12px;padding:9px 15px;font-size:13px;cursor:pointer}
  #reset{background:var(--cell);color:var(--ink)}
  #submit{background:var(--blue);color:#0b1830;font-weight:700}
  #card{margin-top:10px;border-radius:12px;padding:9px 14px;font-size:13px;display:none;border:1px solid var(--cell-edge);line-height:1.45}
  #card.show{display:block}
  #overlay{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:9}
  #overlay.show{display:flex}
  #overlay .big{font-size:46px}
  #overlay .msg{font-size:17px;color:var(--gold);letter-spacing:2px;text-align:center;max-width:80vw}
  #overlay button{background:var(--gold);color:#241d05;font-weight:700}
</style>
</head>
<body>
<h1>GLOWBOX</h1>
<div class="tabs" id="tabs"></div>
<div id="machine">
  <div class="prompt" id="prompt">★ <span>Throw what truly decided the light, and leave it thrown — the smallest true cause wins.</span></div>
  <div id="svgwrap"></div>
  <div class="answer" id="answer"></div>
  <div class="meters">
    <div class="delta" id="delta"></div>
    <div id="hearts"></div>
  </div>
  <div class="btnrow">
    <button id="reset">↺</button>
    <button id="submit">SUBMIT</button>
  </div>
  <div id="card"></div>
</div>
<div id="overlay"><div class="big" id="obig"></div><div class="msg" id="omsg"></div><button onclick="nextLevel()">▸</button></div>

<!--
  Mockup of TRACE (mainTB.tex), white-box track, routing ontology (iteration 9).
  · A junction tests ONE input cell and routes one of two ways — flipping an input never
    removes a transition, it selects the other one (binary inputs; F2/F3). Compound guards
    are drawn as chains of one-input junctions (Shannon expansion: same function).
  · ONE bulb: several machine states may flash the same output; their tracks converge.
  · The board simulates live: in the white-box track the device is fully shipped, so the
    route is deducible by eye; the probe budget β belongs to the black-box & agent tracks.
    The scored resource here is attempts (hearts), per the spec's attempt rule.
  · The recorded run = the board's initial alignment; a blue ring marks each junction
    thrown from recorded. The submission is exactly the ringed set
    ("cells at actual values; the grader supplies the flips").
  · Goal = the TCE question (Credit / HP actual causation), graded as the spec's WITNESS
    task: "submit one set; full credit iff it is correct and subset-minimal … the checker
    accepts ANY correct witness, not a fixed string." Answers are genuinely non-unique.
  · The spec documents BOTH Halpern–Pearl variants (mainTB "which Halpern–Pearl"):
    original/updated (contingencies may be non-actual → overdetermination's causes are
    the singletons) and modified (contingencies at actual values → the joint pair).
    The game accepts a witness under EITHER reading: one demonstrated decider — even
    with the bulb still lit — or a minimal extinguishing set. Supersets always fail.
    A shipped benchmark corpus declares one variant (the paper picks original/updated,
    pending its roadmap-V2 verification against CORP); accepting both is the right
    call for human play, where the variant cannot be communicated nonverbally.
  Grader: AC2(a) necessity under contingency + AC2(b) robustness + AC3 minimality
  (original/updated), OR minimal joint-flip dependence (modified, exogenous cells).
-->

<script>
// node kinds: {test:[row,t], out1, out0} | {next} | {bulb:true} | {gnd:true}; x in column units
const LEVELS=[
 // 1 · one switch, one light
 {rows:["a"],k:1,hearts:2,obs:[[1,0]],
  nodes:[
   {x:0,y:1.1,test:[0,0],out1:1,out0:2},
   {x:1,y:0.4,bulb:true},
   {x:1,y:1.8,gnd:true}]},

 // 2 · delayed cause; two junctions that reroute without deciding
 {rows:["a","b"],k:2,hearts:2,obs:[[1,0,0],[0,1,0]],
  nodes:[
   {x:0,y:1.5,test:[0,0],out1:1,out0:2},
   {x:1,y:0.6,test:[1,1],out1:3,out0:3},
   {x:1,y:2.4,test:[0,1],out1:4,out0:4},
   {x:2,y:0.6,bulb:true},
   {x:2,y:2.4,gnd:true}]},

 // 3 · the gate: either throw darkens it — but BOTH decided it
 {rows:["a","b"],k:1,hearts:2,obs:[[1,0],[0,0]],
  nodes:[
   {x:0,y:1.2,test:[0,0],out1:1,out0:3},
   {x:0.52,y:0.55,test:[1,0],out1:3,out0:2},
   {x:1,y:0.3,bulb:true},
   {x:1,y:2.0,gnd:true}]},

 // 4 · two ways to shine: throw one, the other still carries it
 {rows:["a","b"],k:1,hearts:2,obs:[[1,0],[1,0]],
  nodes:[
   {x:0,y:1.0,test:[0,0],out1:2,out0:1},
   {x:0.52,y:1.7,test:[1,0],out1:2,out0:3},
   {x:1,y:0.55,bulb:true},
   {x:1,y:2.2,gnd:true}]},

 // 5 · deciders at different moments, plus a decoy
 {rows:["a","b"],k:2,hearts:2,obs:[[1,0,0],[0,1,0]],
  nodes:[
   {x:0,y:1.5,test:[0,0],out1:1,out0:2},
   {x:1,y:0.6,test:[0,1],out1:3,out0:3},
   {x:1,y:2.4,test:[1,1],out1:3,out0:4},
   {x:2,y:1.1,bulb:true},
   {x:2,y:2.8,gnd:true}]}
];

let li=0,L,grid,hearts,solved=[];

// ─────── engine: follow the alignment ───────
const clone=g=>g.map(r=>r.slice());
function route(g){
  const seq=[0];let cur=0;
  for(let guard=0;guard<64;guard++){
    const n=L.nodes[cur];
    if(n.test!==undefined)cur=g[n.test[0]][n.test[1]]?n.out1:n.out0;
    else if(n.next!==undefined)cur=n.next;
    else break;
    seq.push(cur);
  }
  return seq;
}
const fires=g=>!!L.nodes[route(g)[route(g).length-1]].bulb;
const cellsIn=()=>{const c=[];for(let r=0;r<L.rows.length;r++)for(let t=0;t<=L.k;t++)c.push([r,t]);return c};
// HP actual cause for a SET of cells (AC1 implicit: cells named at actual values;
// AC2(a) necessity under some contingency W; AC2(b) robust local sufficiency)
function satisfiesAC2(S){
  const inS=(r,t)=>S.some(([rr,tt])=>rr===r&&tt===t);
  const others=cellsIn().filter(([r,t])=>!inS(r,t));
  for(let w=0;w<(1<<others.length);w++){
    const g=clone(L.obs),diff=[];
    others.forEach(([rr,tt],j)=>{const v=(w>>j)&1;if(v!==L.obs[rr][tt]){g[rr][tt]=v;diff.push([rr,tt]);}});
    const gOn=clone(g),gOff=clone(g);
    S.forEach(([r,t])=>gOff[r][t]^=1);          // flip the whole candidate off its actual values
    if(!fires(gOn)||fires(gOff))continue;
    let robust=true;
    for(let s=1;s<(1<<diff.length)&&robust;s++){
      const h=clone(gOn);
      diff.forEach(([rr,tt],j)=>{if((s>>j)&1)h[rr][tt]=L.obs[rr][tt];});
      if(!fires(h))robust=false;
    }
    if(robust)return true;
  }
  return false;
}
// witness predicate, original/updated HP: S is an actual cause AND subset-minimal (AC3)
function isMinimalCause(S){
  if(S.length===0||!satisfiesAC2(S))return false;
  for(let m=1;m<(1<<S.length)-1;m++){           // every proper nonempty subset
    if(satisfiesAC2(S.filter((_,j)=>(m>>j)&1)))return false;
  }
  return true;
}
// modified-HP reading (contingencies at actual values): on exogenous cells this is
// "flipping S with everything else as recorded destroys the effect", subset-minimally —
// i.e. a minimal extinguishing set. The spec documents both variants; the game accepts either.
function flipKills(S){
  const g=clone(L.obs);S.forEach(([r,t])=>g[r][t]^=1);return !fires(g);
}
function isMinimalFlip(S){
  if(S.length===0||!flipKills(S))return false;
  for(let m=1;m<(1<<S.length)-1;m++){
    if(flipKills(S.filter((_,j)=>(m>>j)&1)))return false;
  }
  return true;
}
const isWitness=S=>isMinimalCause(S)||isMinimalFlip(S);
const diffCells=()=>cellsIn().filter(([r,t])=>grid[r][t]!==L.obs[r][t]);

// ─────── geometry ───────
const CW=200,X0=90,NY0=42,LH=66,JR=9;
const px=x=>X0+x*CW, py=y=>NY0+y*LH;
function geom(){
  const ys=L.nodes.map(n=>n.y);
  return {H:py(Math.max(...ys))+46, W:px(L.k)+70};
}
function seg(a,b){ // track curve between node centers, trimmed at both ends
  const x1=px(a.x),y1=py(a.y),x2=px(b.x),y2=py(b.y);
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);
  const t1=(JR+3)/len, t2=1-(JR+3)/len;
  const ax=x1+dx*t1, ay=y1+dy*t1, bx=x1+dx*t2, by=y1+dy*t2;
  const mx=(ax+bx)/2, my=(ay+by)/2-Math.min(18,len*.08);
  return {d:`M${ax},${ay} Q${mx},${my} ${bx},${by}`,
          dIdle:`M${x1+dx*(t1+0.10)},${y1+dy*(t1+0.10)} Q${mx},${my} ${bx},${by}`};
}
// double-branch when out1===out0 (a junction that reroutes nothing): two visible arcs
function seg2(a,b,up){
  const x1=px(a.x),y1=py(a.y),x2=px(b.x),y2=py(b.y);
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);
  const t1=(JR+3)/len,t2=1-(JR+3)/len;
  const ax=x1+dx*t1,ay=y1+dy*t1,bx=x1+dx*t2,by=y1+dy*t2;
  const off=up?-22:22;
  const mx=(ax+bx)/2,my=(ay+by)/2+off;
  return {d:`M${ax},${ay} Q${mx},${my} ${bx},${by}`,
          dIdle:`M${x1+dx*(t1+0.10)},${y1+dy*(t1+0.10)} Q${mx},${my} ${bx},${by}`};
}

// ─────── render ───────
const $=id=>document.getElementById(id);
function render(){
  const G=geom(),seq=route(grid),lit=fires(grid);
  const onRoute=new Set();for(let i=0;i+1<seq.length;i++)onRoute.add(seq[i]+">"+seq[i+1]+">"+(L.nodes[seq[i]].test?grid[L.nodes[seq[i]].test[0]][L.nodes[seq[i]].test[1]]:""));
  let s=`<svg width="${G.W}" height="${G.H}" viewBox="0 0 ${G.W} ${G.H}">`;
  for(let t=0;t<=L.k;t++)
    s+=`<text class="collab ${t===L.k?'k':''}" x="${px(t)}" y="16">${t===L.k?"▼ ":""}${t}</text>`;
  // entry stub into the first junction
  {const n=L.nodes[0];
   s+=`<path class="trk live" d="M${px(n.x)-46},${py(n.y)} L${px(n.x)-JR-3},${py(n.y)}"/>`;}
  // tracks
  L.nodes.forEach((n,i)=>{
    if(n.test!==undefined){
      const v=grid[n.test[0]][n.test[1]];
      const branches=(n.out1===n.out0)
        ?[{to:n.out1,val:1,p:seg2(n,L.nodes[n.out1],true)},{to:n.out0,val:0,p:seg2(n,L.nodes[n.out0],false)}]
        :[{to:n.out1,val:1,p:seg(n,L.nodes[n.out1])},{to:n.out0,val:0,p:seg(n,L.nodes[n.out0])}];
      branches.forEach(b=>{
        const aligned=v===b.val;
        const live=aligned&&onRoute.has(i+">"+b.to+">"+v);
        s+=`<path class="trk ${aligned?(live?'live':''):'idle'}" d="${aligned?b.p.d:b.p.dIdle}"/>`;
        s+=`<path class="trkhit" data-j="${i}" data-v="${b.val}" d="${b.p.d}"/>`;
      });
    }else if(n.next!==undefined){
      const p=seg(n,L.nodes[n.next]);
      const live=onRoute.has(i+">"+n.next+">");
      s+=`<path class="trk ${live?'live':''}" d="${p.d}"/>`;
    }
  });
  // nodes
  L.nodes.forEach((n,i)=>{
    const x=px(n.x),y=py(n.y);
    if(n.bulb){
      s+=`<circle class="bulb ${lit?'lit':'dark'}" cx="${x}" cy="${y}" r="16"/>
          <text class="blab ${lit?'lit':'dark'}" x="${x}" y="${y+5}">⊛</text>`;
      for(let r=0;r<8;r++){const a=r*Math.PI/4;
        s+=`<line class="bulbray ${lit?'lit':''}" x1="${x+Math.cos(a)*20}" y1="${y+Math.sin(a)*20}" x2="${x+Math.cos(a)*25}" y2="${y+Math.sin(a)*25}"/>`;}
    }else if(n.gnd){
      s+=`<line class="gnd" x1="${x-9}" y1="${y}" x2="${x+9}" y2="${y}"/>
          <line class="gnd" x1="${x-5.5}" y1="${y+4.5}" x2="${x+5.5}" y2="${y+4.5}"/>
          <line class="gnd" x1="${x-2.5}" y1="${y+9}" x2="${x+2.5}" y2="${y+9}"/>`;
    }else if(n.test!==undefined){
      const thrown=grid[n.test[0]][n.test[1]]!==L.obs[n.test[0]][n.test[1]];
      if(thrown)s+=`<circle class="jxring" cx="${x}" cy="${y}" r="${JR+5}"/>`;
      s+=`<circle class="jx" cx="${x}" cy="${y}" r="${JR}"/>
          <circle class="jxhit" data-j="${i}" cx="${x}" cy="${y}" r="${JR+8}"/>`;
    }else{
      s+=`<circle class="mg" cx="${x}" cy="${y}" r="3"/>`;
    }
  });
  s+="</svg>";
  $("svgwrap").innerHTML=s;
  document.querySelectorAll(".jxhit").forEach(h=>h.onclick=()=>{
    const n=L.nodes[+h.dataset.j];grid[n.test[0]][n.test[1]]^=1;render();
  });
  document.querySelectorAll(".trkhit").forEach(h=>h.onclick=()=>{
    const n=L.nodes[+h.dataset.j];grid[n.test[0]][n.test[1]]=+h.dataset.v;render();
  });
  const d=diffCells();
  $("answer").innerHTML=(d.length?`<span>thrown:</span>`:``)+
    d.map(([r,t])=>`<span class="chip">moment ${t}</span>`).join("");
  $("delta").textContent=`Δ${d.length}`;
  $("hearts").textContent="♥".repeat(hearts)+"♡".repeat(L.hearts-hearts);
}

// ─────── submit / grade ───────
function card(msg,col){
  const c=$("card");c.className="show";c.style.borderColor=col||"var(--cell-edge)";c.innerHTML=msg;
}
$("reset").onclick=()=>{grid=clone(L.obs);render();$("card").className="";};
$("submit").onclick=()=>{
  const d=diffCells();
  if(d.length===0){card("Throw what decided the light and leave it thrown — the smallest true cause wins.","var(--bad)");return;}
  const ok=isWitness(d);        // ANY correct minimal cause, under either HP reading
  if(ok){
    solved[li]=true;
    $("obig").textContent="✔";$("omsg").textContent="";
    $("overlay").classList.add("show");
  }else{
    hearts--;render();
    // minimality coaching: a smaller correct claim is hiding inside the submission
    let smaller=false;
    for(let m=1;m<(1<<d.length)-1&&!smaller;m++)
      if(isWitness(d.filter((_,j)=>(m>>j)&1)))smaller=true;
    if(hearts<=0){card("Out of tries — tap the level tab to retry.","var(--bad)");hearts=L.hearts;}
    else card(smaller?"A smaller claim is hiding in yours.":"Not quite.","var(--bad)");
  }
};
function renderTabs(){
  $("tabs").innerHTML=LEVELS.map((l,i)=>
    `<div class="tab ${i===li?'active':''} ${solved[i]?'done':''}" onclick="load(${i})">${i+1}</div>`).join("");
}
function load(i){
  li=i;L=LEVELS[i];grid=clone(L.obs);hearts=L.hearts;
  $("prompt").className="prompt"+(i===0?" show":"");
  $("card").className="";renderTabs();render();
}
function nextLevel(){$("overlay").classList.remove("show");load(Math.min(li+1,LEVELS.length-1));}
load(0);
</script>
</body>
</html>
